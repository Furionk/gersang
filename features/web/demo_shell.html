<!DOCTYPE html>
<!-- Web controls must be activated from an actual click, not a boot-time fullscreen request. -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$GODOT_PROJECT_NAME</title>
<style>html,body{margin:0;background:#090a0b;color:#e9dfc3;font-family:system-ui,sans-serif;overflow:hidden}#canvas{display:block;width:100vw;height:100vh;outline:none}#loading{position:fixed;inset:0;background:#090a0b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px}#logo{width:min(420px,70vw);max-height:48vh;object-fit:contain}button{background:#242019;border:1px solid #b29861;color:#fff0c5;border-radius:4px;padding:12px 36px;font-size:18px;cursor:pointer}progress{width:min(420px,75vw);accent-color:#b29861}#note{font-size:13px;color:#b6b5b0;text-align:center}#status{max-width:700px;text-align:center;white-space:pre-wrap}</style>$GODOT_HEAD_INCLUDE</head>
<body><canvas id="canvas" tabindex="0">瀏覽器需要支援WebGL 2。</canvas><section id="loading"><img id="logo" src="gersang-logo.png" alt="巨雙 開源版"><button id="start">開始遊戲</button><progress id="progress" hidden></progress><div id="status">10人出戰 · 隊伍與道具[F2]</div><div id="note">此版本不包含背景音樂，保留音效與語音。<br>已驗證的遊戲分塊會儲存在此瀏覽器，相同內容下次毋須下載。<br>存檔保存在此瀏覽器；無痕模式或清除網站資料可能令進度消失。</div></section>
<script src="$GODOT_URL"></script><script src="__GERSANG_LOADER__"></script><script>
const config=$GODOT_CONFIG,start=document.getElementById('start'),status=document.getElementById('status'),progress=document.getElementById('progress'),canvas=document.getElementById('canvas');
let engine,bootFailed=false;
const downloads=new GersangDownload.Download({
  onProgress(current,total){progress.max=total;progress.value=current;status.textContent=`下載 ${Math.min(99,Math.floor(current/total*100))}% · ${(current/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MiB`},
  onRetry(attempt,total){status.textContent=`連線中斷，正在自動重試（${attempt}/${total}）…`}
});
const toolbar=document.createElement('nav');toolbar.setAttribute('aria-label','遊戲視窗工具');toolbar.style.cssText='position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10';toolbar.hidden=true;document.body.appendChild(toolbar);
for(const type of ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','keydown','keyup','click'])toolbar.addEventListener(type,event=>event.stopPropagation());
const full=document.createElement('button');full.textContent='全螢幕';full.style.cssText='font-size:13px;padding:5px 12px;white-space:nowrap;flex-shrink:0';toolbar.appendChild(full);
const audio=document.createElement('button');audio.textContent='測試聲音';audio.style.cssText=full.style.cssText;toolbar.appendChild(audio);
const notice=document.createElement('output');notice.style.cssText='font-size:12px;background:#090a0b;padding:5px;max-width:260px';toolbar.appendChild(notice);
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();canvas.focus()}catch(error){notice.textContent='此瀏覽器不允許全螢幕：'+error.message}};
document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'退出全螢幕':'全螢幕');
window.gersangWeb={test:null,setAudioTest(callback){this.test=callback;toolbar.hidden=false},audioResult(db){notice.textContent=db>-100?'已輸出測試音；若聽不到，請取消分頁靜音。':'音訊尚未啟用，請點遊戲畫面再試。';console.info('WEB_AUDIO_PEAK',db);setTimeout(()=>notice.textContent='',8000)}};
audio.onclick=()=>{canvas.focus();if(window.gersangWeb.test){notice.textContent='正在播放遊戲測試音…';window.gersangWeb.test()}else notice.textContent='請先開始遊戲。'};
canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('keydown',e=>{if(['F1','F2',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});
start.onclick=async()=>{
  if(bootFailed){location.reload();return}
  start.disabled=true;start.hidden=true;progress.hidden=false;status.textContent='正在取得下載清單…';
  let booting=false,rejectBoot,timer;
  const bootError=event=>{if(booting){rejectBoot(event.reason||event.error||new Error(event.message||'引擎啟動失敗'));if(event.type==='unhandledrejection')event.preventDefault()}};
  try{
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length)throw new Error('瀏覽器不支援：'+missing.join(', '));
    const expected=Object.fromEntries(Object.entries(config.fileSizes).filter(([name])=>name.endsWith('.pck')||name.endsWith('.wasm')));
    const assets=await downloads.load(new URL('__GERSANG_MANIFEST__',location.href).href,expected);
    status.textContent='資料驗證完成，正在啟動遊戲…';progress.removeAttribute('value');booting=true;
    window.addEventListener('unhandledrejection',bootError);window.addEventListener('error',bootError);
    const failure=new Promise((resolve,reject)=>{rejectBoot=reject;timer=setTimeout(()=>reject(new Error('引擎啟動逾時，請重新啟動')),90000)});
    engine=new Engine(config);
    await Promise.race([GersangDownload.withAssets(assets,location.href,()=>engine.init(config.executable)),failure]);
    const pack=config.mainPack||config.executable+'.pck';
    await engine.preloadFile(assets.get(pack),pack);
    await Promise.race([engine.start({args:['--main-pack',pack,...(config.args||[])]}),failure]);
    downloads.release();document.getElementById('loading').remove();canvas.focus();
  }catch(error){
    bootFailed=booting;
    status.textContent='啟動失敗：'+error.message+(bootFailed?'\n請重新啟動；玩家存檔不會被清除。':'\n已下載的完整段落會保留，重試不會清除存檔。');
    start.textContent=bootFailed?'重新啟動':'重試下載';start.hidden=false;start.disabled=false;console.error(error);
  }finally{clearTimeout(timer);booting=false;window.removeEventListener('unhandledrejection',bootError);window.removeEventListener('error',bootError)}
};
</script></body></html>
